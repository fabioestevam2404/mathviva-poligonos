# Verifica cada pull request e cada push na main: rastreabilidade spec ↔ teste e todos os testes.
# Sem dependências para instalar: o projeto usa apenas o Node.
name: Checagem

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o fluxo só precisa ler o código.
permissions:
  contents: read

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagem:
    name: Checagem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ações fixadas pelo SHA do commit (SEC-07): uma tag pode ser movida, um SHA não.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Specs, rastreabilidade e testes
        run: npm run check
