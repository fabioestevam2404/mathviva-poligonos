# Verifica cada pull request e cada push na main: rastreabilidade spec ↔ teste e todos os testes.
# Sem dependências para instalar: o projeto usa apenas o Node.
name: Checagem

on:
  pull_request:
  push:
    branches: [main]

# Menor privilégio: o fluxo só precisa ler o código.
permissions:
  contents: read

concurrency:
  group: checagem-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checagem:
    name: Checagem
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Specs, rastreabilidade e testes
        run: npm run check
